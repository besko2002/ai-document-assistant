spring:
  application:
    name: ai-document-assistant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/docassistant}
    username: ${DB_USERNAME:doc}
    password: ${DB_PASSWORD:doc}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: doc-assistant-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# AI providers. Keys come from the environment only — never commit them.
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    chat-model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  # Placeholder for the Phase 3 fallback provider (used when Gemini returns 429).
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    chat-model: ${GROQ_CHAT_MODEL:llama-3.3-70b-versatile}

app:
  jwt:
    # HS256 signing secret, at least 32 bytes. The default is for local development only.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiration: ${JWT_EXPIRATION:PT1H}
  rag:
    top-k: ${RAG_TOP_K:5}
    embedding-dimensions: 768
    retry-delay-ms: ${AI_RETRY_DELAY_MS:2000}
  documents:
    max-pages: ${MAX_PDF_PAGES:300}
    chunk-size: ${CHUNK_SIZE:1000}
    chunk-overlap: ${CHUNK_OVERLAP:150}

logging:
  level:
    com.example.docassistant: ${LOG_LEVEL_APP:INFO}
